[package]
name = "script"
version.workspace = true
edition.workspace = true

[dependencies]
elevato-core = { workspace = true }
# `internals` exposes the token mapper that lets players spell the boot
# function `fn new()` — `new` is a reserved rhai keyword otherwise.
rhai = { workspace = true, features = ["internals"] }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { workspace = true, features = ["wasm-bindgen"] }
