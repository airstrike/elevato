<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="elevato.rs - Elevator Saga, RIIR'd: program a bank of elevators in Rhai and watch the simulation clear the challenges. Runs in your browser via iced and WebAssembly." />
    <title>elevato.rs</title>
    <link rel="canonical" href="https://elevato.rs/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta property="og:title" content="elevato.rs" />
    <meta property="og:description" content="Elevator Saga, RIIR'd - program elevators in Rhai, in your browser." />
    <meta property="og:url" content="https://elevato.rs/" />
    <meta property="og:image" content="https://elevato.rs/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <base data-trunk-public-url />
    <style>
        /* The landing card wears exactly the iced splash's clothes -
           panel-shade surface, Geist Mono, the theme's ink and accent -
           so the wasm handoff reads as one screen coming alive. Colors
           mirror src/theme.rs; the app reads prefers-color-scheme too,
           so both stages always agree. */
        @font-face {
            font-family: "Geist Mono";
            src: url("GeistMono-Variable.ttf") format("truetype-variations");
            font-weight: 100 900;
        }
        :root {
            color-scheme: light dark;
            --bg: #e8e4da;
            --text: #2b2a27;
            --track: #cfcabd;
            --accent: #2e8c5f;
            --failure: #c0473a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #22211e;
                --text: #ece7db;
                --track: #35332e;
                --accent: #50b481;
                --failure: #d95f4e;
            }
        }
        /* The app canvas is styled `width:100%; height:100%` by the
           winit web backend. Percentage WIDTH resolves against the
           body's always-definite width, but percentage HEIGHT needs a
           definite ancestor chain - without it the canvas collapses to
           its backing-store height and the app renders short. */
        /* overscroll-behavior kills the rubber-band bounce mobile
           browsers add past the page edge (the page itself never
           scrolls); touch-action hands every finger gesture on the
           canvas to the app instead of the browser's pan/zoom. */
        html, body { margin: 0; height: 100%; overscroll-behavior: none; }
        body { background: var(--bg); overflow: hidden; }
        body > canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        /* winit-web inserts a hidden input for IME; when the canvas
           takes keyboard focus (e.g. the code editor), browsers draw
           its focus ring as a rogue line at the page edge. Nothing on
           this page needs a native focus ring - the app draws its own
           focus affordances on canvas. */
        body :focus, body :focus-visible { outline: none; }
        #intro {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-sizing: border-box;
            font-family: "Geist Mono", ui-monospace, monospace;
            color: var(--text);
            text-align: center;
        }
        /* The iced splash draws its title at size 56, regular weight. */
        #intro h1 { margin: 0; font-size: 56px; font-weight: 400; }
        #intro .loading {
            width: 180px;
            height: 2px;
            background: var(--track);
            position: relative;
            overflow: hidden;
        }
        #intro .loading::after {
            content: "";
            position: absolute;
            width: 56px;
            height: 100%;
            background: var(--accent);
            animation: sweep 1.1s ease-in-out infinite alternate;
        }
        @keyframes sweep {
            from { left: 0; }
            to { left: 124px; }
        }
        #intro .failure {
            font-size: 14px;
            color: var(--failure);
            max-width: 34rem;
        }
        /* The debug overlay: panel shade, hairline top in failure red,
           mono like everything else. Sits over the canvas; never taller
           than half the viewport so the app stays visible behind it. */
        #debug {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 2147483647;
            max-height: 50vh;
            overflow-y: auto;
            background: var(--bg);
            color: var(--text);
            border-top: 2px solid var(--failure);
            font: 12px/1.5 "Geist Mono", ui-monospace, monospace;
            padding: 8px 12px 12px;
            -webkit-user-select: text; user-select: text;
        }
        #debug .bar { display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 4px; }
        #debug button {
            font: inherit; color: var(--text); background: none;
            border: 1px solid var(--track); border-radius: 6px; padding: 2px 10px; cursor: pointer;
        }
        #debug .entry { border-left: 3px solid var(--track); padding: 4px 10px; margin: 4px 0; }
        #debug .entry.error, #debug .entry.panic { border-left-color: var(--failure); }
        #debug .entry.rejection { border-left-color: var(--accent); }
        #debug .head { opacity: 0.6; font-size: 11px; }
        #debug pre { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
    </style>
</head>
<body>
<div id="intro">
    <h1>elevato.rs</h1>
    <div class="loading" role="progressbar" aria-label="Loading"></div>
</div>
<script>
    // iced appends its canvas to <body> once the wasm app starts; the
    // landing card bows out then. (A MutationObserver rather than
    // trunk's TrunkApplicationStarted event, which this trunk version
    // predates.)
    const observer = new MutationObserver(() => {
        if (document.querySelector("body > canvas")) {
            document.getElementById("intro")?.remove();
            observer.disconnect();
        }
    });
    observer.observe(document.body, { childList: true });

    // Boot-failure surface: consoles are invisible on phones, so any
    // uncaught error or rejected promise replaces the loading line.
    function bootFailure(detail) {
        const loading = document.querySelector("#intro .loading");
        if (!loading || document.querySelector("body > canvas")) return;
        const failure = document.createElement("p");
        failure.className = "failure";
        failure.textContent = "Boot failed: " + detail;
        loading.replaceWith(failure);
    }
    addEventListener("error", (e) => bootFailure(e.message || String(e.error)));
    addEventListener("unhandledrejection", (e) => bootFailure(String(e.reason)));

    // Debug overlay: every JS error, unhandled rejection, and wasm panic
    // (console_error_panic_hook writes to console.error) lands in a
    // panel at the bottom of the page, so a crash on a phone can be
    // read and copied without devtools. Hidden until something fails.
    const overlay = document.createElement("div");
    overlay.id = "debug";
    overlay.setAttribute("role", "log");
    overlay.hidden = true;
    const log = document.createElement("div");
    const bar = document.createElement("div");
    bar.className = "bar";
    const copy = document.createElement("button");
    copy.textContent = "copy";
    copy.onclick = () => {
        navigator.clipboard?.writeText(log.innerText).then(
            () => { copy.textContent = "copied"; setTimeout(() => copy.textContent = "copy", 1200); },
            () => { copy.textContent = "select + copy manually"; },
        );
    };
    const close = document.createElement("button");
    close.textContent = "close";
    close.onclick = () => { overlay.hidden = true; log.textContent = ""; };
    bar.append(copy, close);
    overlay.append(bar, log);
    document.body.appendChild(overlay);

    function report(kind, message, source) {
        overlay.hidden = false;
        const entry = document.createElement("div");
        entry.className = "entry " + kind;
        const head = document.createElement("span");
        head.className = "head";
        head.textContent = "[" + new Date().toLocaleTimeString() + "] " + kind;
        const body = document.createElement("pre");
        body.textContent = message + (source ? "\n" + source : "");
        entry.append(head, body);
        log.appendChild(entry);
        overlay.scrollTop = overlay.scrollHeight;
    }
    addEventListener("error", (e) =>
        report("error", e.message || String(e.error), e.filename ? e.filename + ":" + e.lineno + ":" + e.colno : ""));
    addEventListener("unhandledrejection", (e) =>
        report("rejection", e.reason instanceof Error ? e.reason.message : String(e.reason),
            e.reason?.stack ? e.reason.stack.split("\n").slice(1, 4).join("\n") : ""));
    const consoleError = console.error.bind(console);
    console.error = (...args) => {
        const message = args.map(String).join(" ");
        if (/panicked|wasm|RuntimeError|unreachable/i.test(message)) report("panic", message, "");
        consoleError(...args);
    };

    // Mouse back/forward buttons are the reference's history keys; the
    // browser must not ALSO navigate. winit preventDefaults keyboard
    // events but not auxiliary mouse buttons, so we do it here (the
    // canvas still receives the pointer events).
    for (const kind of ["mousedown", "mouseup", "pointerup", "auxclick"]) {
        addEventListener(kind, (e) => {
            if (e.button === 3 || e.button === 4) e.preventDefault();
        });
    }
</script>
<link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-bin="elevato" />
<link data-trunk rel="copy-file" href="assets/fonts/OFL.txt" />
<link data-trunk rel="copy-file" href="assets/og.png" />
<link data-trunk rel="copy-file" href="assets/favicon.svg" />
<link data-trunk rel="copy-file" href="assets/favicon-32.png" />
<link data-trunk rel="copy-file" href="assets/apple-touch-icon.png" />
<link data-trunk rel="copy-file" href="assets/fonts/GeistMono-Variable.ttf" />
</body>
</html>
