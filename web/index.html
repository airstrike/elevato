<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="elevato.rs - Elevator Saga, RIIR'd: program a bank of elevators in Rust and watch the simulation clear the challenges. Runs in your browser via iced and WebAssembly." />
    <title>elevato.rs</title>
    <link rel="canonical" href="https://elevato.rs/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta property="og:title" content="elevato.rs" />
    <meta property="og:description" content="Elevator Saga, RIIR'd - program elevators in Rust, in your browser." />
    <meta property="og:url" content="https://elevato.rs/" />
    <meta property="og:image" content="https://elevato.rs/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
        /* The landing card wears exactly the iced splash's clothes -
           panel-shade surface, Geist Mono, the theme's ink and accent -
           so the wasm handoff reads as one screen coming alive. Colors
           mirror src/theme.rs; the app reads prefers-color-scheme too,
           so both stages always agree. */
        @font-face {
            font-family: "Geist Mono";
            src: url("GeistMono-Variable.ttf") format("truetype-variations");
            font-weight: 100 900;
        }
        :root {
            color-scheme: light dark;
            --bg: #e8e4da;
            --text: #2b2a27;
            --track: #cfcabd;
            --accent: #2e8c5f;
            --failure: #c0473a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #22211e;
                --text: #ece7db;
                --track: #35332e;
                --accent: #50b481;
                --failure: #d95f4e;
            }
        }
        /* overscroll-behavior kills the rubber-band bounce mobile
           browsers add past the page edge (the page itself never
           scrolls). */
        html, body { margin: 0; height: 100%; overscroll-behavior: none; }
        body { background: var(--bg); overflow: hidden; }
        /* Each run of the program is a frame of its own (elevato.js),
           all stacked over the page; the one the player sees is on
           top, the next one waits under it. */
        iframe.game {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            border: 0; display: block;
            background: var(--bg);
        }
        iframe.game.next { visibility: hidden; }
        body :focus, body :focus-visible { outline: none; }
        #intro {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-sizing: border-box;
            font-family: "Geist Mono", ui-monospace, monospace;
            color: var(--text);
            text-align: center;
        }
        /* The iced splash draws its title at size 56, regular weight. */
        #intro h1 { margin: 0; font-size: 56px; font-weight: 400; }
        #intro .loading {
            width: 180px;
            height: 2px;
            background: var(--track);
            position: relative;
            overflow: hidden;
        }
        #intro .loading::after {
            content: "";
            position: absolute;
            width: 56px;
            height: 100%;
            background: var(--accent);
            animation: sweep 1.1s ease-in-out infinite alternate;
        }
        @keyframes sweep {
            from { left: 0; }
            to { left: 124px; }
        }
        #intro .failure {
            font-size: 14px;
            color: var(--failure);
            max-width: 34rem;
        }
        /* The debug overlay: panel shade, hairline top in failure red,
           mono like everything else. Sits over the canvas; never taller
           than half the viewport so the app stays visible behind it. */
        #debug {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 2147483647;
            max-height: 50vh;
            overflow-y: auto;
            background: var(--bg);
            color: var(--text);
            border-top: 2px solid var(--failure);
            font: 12px/1.5 "Geist Mono", ui-monospace, monospace;
            padding: 8px 12px 12px;
            -webkit-user-select: text; user-select: text;
        }
        #debug .bar { display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 4px; }
        #debug button {
            font: inherit; color: var(--text); background: none;
            border: 1px solid var(--track); border-radius: 6px; padding: 2px 10px; cursor: pointer;
        }
        #debug .entry { border-left: 3px solid var(--track); padding: 4px 10px; margin: 4px 0; }
        #debug .entry.error, #debug .entry.panic { border-left-color: var(--failure); }
        #debug .entry.rejection { border-left-color: var(--accent); }
        #debug .head { opacity: 0.6; font-size: 11px; }
        #debug pre { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
    </style>
</head>
<body>
<div id="intro">
    <h1>elevato.rs</h1>
    <div class="loading" role="progressbar" aria-label="Loading"></div>
</div>
<script>
    // Boot-failure surface: consoles are invisible on phones, so any
    // uncaught error or rejected promise replaces the loading line.
    function bootFailure(detail) {
        const loading = document.querySelector("#intro .loading");
        if (!loading) return;
        const failure = document.createElement("p");
        failure.className = "failure";
        failure.textContent = detail;
        loading.replaceWith(failure);
    }
    // A script from another origin, such as a browser extension's, that
    // throws reaches the page only as "Script error.", with no error, file
    // or line: it isn't the page's, and it says nothing, so neither the
    // boot nor the overlay takes it.
    const foreign = (e) => !e.error && !e.filename && !e.lineno;
    addEventListener("error", (e) => { if (!foreign(e)) bootFailure(e.message || String(e.error)); });
    addEventListener("unhandledrejection", (e) => bootFailure(String(e.reason)));

    // Debug overlay: every JS error, unhandled rejection, and wasm panic
    // (console_error_panic_hook writes to console.error, in the game's
    // frame too) lands in a panel at the bottom of the page, so a crash
    // on a phone can be read and copied without devtools. Hidden until
    // something fails.
    const overlay = document.createElement("div");
    overlay.id = "debug";
    overlay.setAttribute("role", "log");
    overlay.hidden = true;
    const log = document.createElement("div");
    const bar = document.createElement("div");
    bar.className = "bar";
    const copy = document.createElement("button");
    copy.textContent = "copy";
    copy.onclick = () => {
        navigator.clipboard?.writeText(log.innerText).then(
            () => { copy.textContent = "copied"; setTimeout(() => copy.textContent = "copy", 1200); },
            () => { copy.textContent = "select + copy manually"; },
        );
    };
    const close = document.createElement("button");
    close.textContent = "close";
    close.onclick = () => { overlay.hidden = true; log.textContent = ""; };
    bar.append(copy, close);
    overlay.append(bar, log);
    document.body.appendChild(overlay);

    function report(kind, message, source) {
        overlay.hidden = false;
        const entry = document.createElement("div");
        entry.className = "entry " + kind;
        const head = document.createElement("span");
        head.className = "head";
        head.textContent = "[" + new Date().toLocaleTimeString() + "] " + kind;
        const body = document.createElement("pre");
        body.textContent = message + (source ? "\n" + source : "");
        entry.append(head, body);
        log.appendChild(entry);
        overlay.scrollTop = overlay.scrollHeight;
    }
    addEventListener("error", (e) => {
        if (foreign(e)) return;
        report("error", e.message || String(e.error), e.filename ? e.filename + ":" + e.lineno + ":" + e.colno : "");
    });
    addEventListener("unhandledrejection", (e) =>
        report("rejection", e.reason instanceof Error ? e.reason.message : String(e.reason),
            e.reason?.stack ? e.reason.stack.split("\n").slice(1, 4).join("\n") : ""));
    const consoleError = console.error.bind(console);
    console.error = (...args) => {
        const message = args.map(String).join(" ");
        if (/panicked|wasm|RuntimeError|unreachable/i.test(message)) report("panic", message, "");
        consoleError(...args);
    };
</script>
<script type="module" src="elevato.js"></script>
</body>
</html>
