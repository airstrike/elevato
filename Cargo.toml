[package]
name = "elevato"
version.workspace = true
edition.workspace = true

[dependencies]
elevato-core = { workspace = true }
iced = { workspace = true }
script = { workspace = true }
syntect = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { workspace = true }
open = "5"
# Native-only: granita is hot-reload dev tooling; its stack (tokio, mio,
# notify) does not build on wasm32, and previews are a desktop workflow.
granita = { path = "/Users/andy/projects/granita/crates/granita", features = ["mcp"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { workspace = true, features = ["webgl", "fira-sans"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "MediaQueryList"] }

[workspace]
resolver = "3"
members = ["core", "script"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Short directory `core/`, prefixed package (bare `core` collides with std).
elevato-core = { path = "core" }
script = { path = "script" }

iced = { path = "/Users/andy/projects/iced-web-clipboard", features = ["canvas", "tokio", "advanced", "selector"] }
rhai = "1"
thiserror = "2"

# Highlighting: parsing only (the app maps scopes to theme colors
# itself); fancy-regex backend — wasm-clean, never onig.
syntect = { version = "5", default-features = false, features = ["parsing", "yaml-load", "regex-fancy"] }
dirs = "6"

# The iced checkout patches cosmic-text to a sibling path in its own
# workspace; a path dependency on that iced must mirror the patch or
# cargo resolves two incompatible cosmic-text sources.
[patch.crates-io]
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "span-padding" }
# granita's own iced deps resolve from crates.io; these path patches unify
# them with the app's direct path dep (same canonical path → one instance),
# so granita and elevato share the fork's types (incl. its cosmic-text API).
iced = { path = "/Users/andy/projects/iced-web-clipboard" }
iced_core = { path = "/Users/andy/projects/iced-web-clipboard/core" }
iced_futures = { path = "/Users/andy/projects/iced-web-clipboard/futures" }
iced_graphics = { path = "/Users/andy/projects/iced-web-clipboard/graphics" }
iced_renderer = { path = "/Users/andy/projects/iced-web-clipboard/renderer" }
iced_runtime = { path = "/Users/andy/projects/iced-web-clipboard/runtime" }
# elevato's rhai fork (branch `enums`): de-reserves `new` so the dialect's
# `fn new()` parses natively — replaces the `internals` token-remap hack.
# Publish flip: push the branch to airstrike/rhai and patch by git.
rhai = { path = "/Users/andy/projects/rhai" }

[lib]
crate-type = ["lib", "dylib"]

[build-dependencies]
granita-build = { path = "/Users/andy/projects/granita/crates/granita-build" }
iced_lucide = { git = "https://github.com/airstrike/iced_lucide" }

[profile.dev]
# rpath lives in .cargo/config.toml as a native-target-scoped `-C rpath`
# rustflag: the profile form would inject `-Wl,-rpath` into the wasm32
# link, which rust-lld rejects.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

# ----------------------------------------------------------------------
# Publish flip — clean-clone builds from the airstrike forks.
#
# Keep COMMENTED while developing against the local checkouts. To
# activate (full checklist in PUBLISHING.md):
#
#   1. Push branch `web-clipboard` to https://github.com/airstrike/iced
#      and the local cosmic-text `span-padding` state to
#      https://github.com/airstrike/cosmic-text.
#   2. Replace the `iced` entry in [workspace.dependencies] above with:
#        iced = { version = "0.15.0-dev", features = ["canvas", "tokio", "advanced"] }
#   3. Delete the live [patch.crates-io] block above, uncomment the one
#      below, and run `cargo update`.
#
# Every iced sub-crate in Cargo.lock is patched from the same git source
# (the armature shape). Entries nothing requests from crates.io make
# cargo warn "was not used in the crate graph" — harmless; prune them if
# the noise bothers you. Note: the fork's iced transitively pins
# winit = { git = "airstrike/winit", branch = "unified-titlebar" } via
# its own manifest; that branch must stay reachable too.
#
# [patch.crates-io]
# iced = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_core = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_debug = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_futures = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_graphics = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_program = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_renderer = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_runtime = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_tiny_skia = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_wgpu = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_widget = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# iced_winit = { git = "https://github.com/airstrike/iced.git", branch = "web-clipboard" }
# cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "span-padding" }
